<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130"><rect x="0" y="0" width="1600" height="1130" fill="white" stroke="white" stroke-width="0"/><text x="45" y="45" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#153e66" text-anchor="start">Bảng biến A4 — BIẾN CŨ GIỮ, ĐỔI HOẶC BỎ</text><text x="45" y="78" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#18559a" text-anchor="start">Thay phần điều khiển cũ bằng bản 22 Network này, không giữ hai nơi cùng ghi trạng thái</text><rect x="40" y="100" width="1520" height="43" fill="#dfe7f0" stroke="#aebed0" stroke-width="1.5"/><text x="55" y="130" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#182333" text-anchor="start">▼  Bảng biến A4 — BIẾN CŨ GIỮ, ĐỔI HOẶC BỎ</text><rect x="52" y="151" width="1496" height="44" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="64" y="178" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#526477" text-anchor="start">HMI_STOP_NHAN và HMI_DUNUOC chỉ xóa sau khi kiểm tra Events/Animations/Scripts và nguồn mức nước.</text><rect x="65" y="240" width="1450" height="95" fill="#dfe7f0" stroke="#b8c5d4" stroke-width="1.5"/><text x="75" y="275" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">Biến cũ</text><text x="515" y="275" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">Cách xử lý trong bản mới</text><rect x="65" y="335" width="1450" height="95" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="360" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">chon_auto_hmi</text><text x="515" y="360" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Giữ biến, đổi thành lệnh nhấn AUTO từ HMI; không còn là trạng thái AUTO.</text><rect x="65" y="430" width="1450" height="95" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="455" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">hmi_stop</text><text x="515" y="455" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Giữ biến, đổi thành lệnh nhấn STOP từ HMI; trạng thái dừng chuyển sang tam_dung.</text><rect x="65" y="525" width="1450" height="95" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="550" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">hmi_reset</text><text x="515" y="550" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Giữ lệnh nhấn nhả như trước; hợp với RESET thật.</text><rect x="65" y="620" width="1450" height="95" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="645" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">CHO PHÉP AUTO</text><text x="515" y="645" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Giữ tên và kiểu Bool; nay là AUTO chung từ cả hai nguồn.</text><rect x="65" y="715" width="1450" height="95" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="740" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">ĐÃ GẠT TẮT / KHỞI TẠO CHỜ</text><text x="515" y="740" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Không dùng trong bản mới; chỉ xóa sau khi thay toàn bộ logic và kiểm tra tham chiếu.</text><rect x="65" y="810" width="1450" height="95" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="835" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">CÓ VAN MỞ</text><text x="515" y="835" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Không dùng trong bản mới; kiểm tra tham chiếu trước khi xóa.</text><rect x="65" y="905" width="1450" height="95" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="930" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Các biến RTC, bước, ET và Q</text><text x="515" y="930" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Giữ nguyên; giaydachay3 được đổi tên theo bảng A2.</text><text x="45" y="1087" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#526477" text-anchor="start">LAD cho mô hình sáu đèn · Dây xanh là màu minh họa, không phải trạng thái online.</text><text x="45" y="1112" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#526477" text-anchor="start">Vẽ lại để nhập/đối chiếu trong TIA V16; chưa Compile hoặc chạy trên CPU Siemens.</text><text x="1555" y="1112" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#526477" text-anchor="end">Trang 32</text></svg>