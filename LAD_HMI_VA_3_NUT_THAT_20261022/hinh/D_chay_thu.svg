<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130"><rect x="0" y="0" width="1600" height="1130" fill="white" stroke="white" stroke-width="0"/><text x="45" y="45" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#153e66" text-anchor="start">Trình tự D — NHẬP, KIỂM TRA VÀ CHẠY THỬ</text><text x="45" y="78" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#18559a" text-anchor="start">Không coi việc vẽ đúng ký hiệu là đã Compile hoặc kiểm chứng PLC</text><rect x="40" y="100" width="1520" height="43" fill="#dfe7f0" stroke="#aebed0" stroke-width="1.5"/><text x="55" y="130" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#182333" text-anchor="start">▼  Trình tự D — NHẬP, KIỂM TRA VÀ CHẠY THỬ</text><rect x="52" y="151" width="1496" height="44" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="64" y="178" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#526477" text-anchor="start">Kết quả mô hình vòng quét nằm trong thư mục kiem_tra; vẫn phải xác minh trong TIA/PLCSIM.</text><rect x="65" y="240" width="1450" height="95" fill="#dfe7f0" stroke="#b8c5d4" stroke-width="1.5"/><text x="75" y="275" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">Bước</text><text x="175" y="275" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">Thực hiện</text><rect x="65" y="335" width="1450" height="95" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="360" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#182333" text-anchor="start">1</text><text x="175" y="360" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#182333" text-anchor="start">Lưu bản sao project; bật System memory byte MB1 để có FirstScan M1.0; tạo biến và TON mới.</text><rect x="65" y="430" width="1450" height="95" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="455" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#182333" text-anchor="start">2</text><text x="175" y="455" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#182333" text-anchor="start">Nhập đúng thứ tự 22 Network; một Network có thể trải trên nhiều trang PDF.</text><rect x="65" y="525" width="1450" height="95" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="550" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#182333" text-anchor="start">3</text><text x="175" y="550" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#182333" text-anchor="start">Đổi Events HMI và các liên kết hiển thị theo B1–B2; Compile cả PLC và HMI.</text><rect x="65" y="620" width="1450" height="95" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="645" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#182333" text-anchor="start">4</text><text x="175" y="645" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#182333" text-anchor="start">CPU vào RUN: nhả START/STOP/RESET và các lệnh HMI ít nhất 30 ms; đặt tín hiệu bảo vệ hợp lệ.</text><rect x="65" y="715" width="1450" height="95" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="740" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#182333" text-anchor="start">5</text><text x="175" y="740" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#182333" text-anchor="start">Nếu đang có NHỚ LỖI: RESET, nhả RESET, rồi nhấn START thật hoặc AUTO trên HMI.</text><rect x="65" y="810" width="1450" height="95" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="835" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#182333" text-anchor="start">6</text><text x="175" y="835" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#182333" text-anchor="start">Thử START thật → STOP HMI → tiếp tục bằng STOP thật; đối chiếu bước và thời gian.</text><rect x="65" y="905" width="1450" height="95" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="930" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#182333" text-anchor="start">7</text><text x="175" y="930" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#182333" text-anchor="start">Thử giữ nút, nhấn đồng thời, RESET, từng lỗi và hết ca trước khi dùng bảng thực hành.</text><text x="80" y="1050" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#18559a" text-anchor="start">Mô hình Python: 25 nhóm kiểm tra đạt; kết quả này không thay cho Compile và chạy thử trong TIA.</text><text x="45" y="1087" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#526477" text-anchor="start">LAD cho mô hình sáu đèn · Dây xanh là màu minh họa, không phải trạng thái online.</text><text x="45" y="1112" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#526477" text-anchor="start">Vẽ lại để nhập/đối chiếu trong TIA V16; chưa Compile hoặc chạy trên CPU Siemens.</text><text x="1555" y="1112" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#526477" text-anchor="end">Trang 36</text></svg>