<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130"><rect x="0" y="0" width="1600" height="1130" fill="white" stroke="white" stroke-width="0"/><text x="45" y="45" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#153e66" text-anchor="start">Bảng biến A1 — CẤU HÌNH VÀ LỌC NÚT</text><text x="45" y="78" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#18559a" text-anchor="start">Các Bool trạng thái Start value = FALSE, không Retain</text><rect x="40" y="100" width="1520" height="43" fill="#dfe7f0" stroke="#aebed0" stroke-width="1.5"/><text x="55" y="130" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#182333" text-anchor="start">▼  Bảng biến A1 — CẤU HÌNH VÀ LỌC NÚT</text><rect x="52" y="151" width="1496" height="44" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="64" y="178" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#526477" text-anchor="start">Riêng stop_thuong_dong phải đặt Start value đúng loại tiếp điểm trước khi download; không chỉ Modify online.</text><rect x="65" y="240" width="1450" height="80" fill="#dfe7f0" stroke="#b8c5d4" stroke-width="1.5"/><text x="75" y="275" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">Biến mới trong DB daiphunnuoc</text><text x="495" y="275" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">Kiểu</text><text x="625" y="275" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">Công dụng</text><rect x="65" y="320" width="1450" height="80" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="345" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">stop_thuong_dong</text><text x="495" y="345" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Bool</text><text x="625" y="345" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">FALSE nếu STOP NO; TRUE nếu STOP NC</text><rect x="65" y="400" width="1450" height="80" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="425" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">nut_stop_nhan</text><text x="495" y="425" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Bool</text><text x="625" y="425" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Nhấn STOP sau chuẩn hóa = 1</text><rect x="65" y="480" width="1450" height="80" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="505" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">nut_auto_da_loc</text><text x="495" y="505" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Bool</text><text x="625" y="505" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">START sau lọc nhấn/nhả 30 ms</text><rect x="65" y="560" width="1450" height="80" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="585" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">nut_stop_da_loc</text><text x="495" y="585" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Bool</text><text x="625" y="585" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">STOP sau lọc nhấn/nhả 30 ms</text><rect x="65" y="640" width="1450" height="80" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="665" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">nut_reset_da_loc</text><text x="495" y="665" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Bool</text><text x="625" y="665" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">RESET sau lọc nhấn/nhả 30 ms</text><rect x="65" y="720" width="1450" height="80" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="745" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">tat_ca_lenh_da_nha</text><text x="495" y="745" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Bool</text><text x="625" y="745" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Các nút và lệnh đều nhả</text><rect x="65" y="800" width="1450" height="80" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="825" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">nha_lenh_on_dinh</text><text x="495" y="825" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Bool</text><text x="625" y="825" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Đã nhả liên tục 30 ms</text><rect x="65" y="880" width="1450" height="80" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="905" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">da_nha_lenh</text><text x="495" y="905" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Bool</text><text x="625" y="905" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Cho nhận xung START/STOP sau khởi động</text><text x="45" y="1087" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#526477" text-anchor="start">LAD cho mô hình sáu đèn · Dây xanh là màu minh họa, không phải trạng thái online.</text><text x="45" y="1112" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#526477" text-anchor="start">Vẽ lại để nhập/đối chiếu trong TIA V16; chưa Compile hoặc chạy trên CPU Siemens.</text><text x="1555" y="1112" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#526477" text-anchor="end">Trang 29</text></svg>