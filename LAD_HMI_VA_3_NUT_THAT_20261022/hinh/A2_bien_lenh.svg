<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130"><rect x="0" y="0" width="1600" height="1130" fill="white" stroke="white" stroke-width="0"/><text x="45" y="45" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#153e66" text-anchor="start">Bảng biến A2 — LỆNH VÀ TRẠNG THÁI CHUNG</text><text x="45" y="78" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#18559a" text-anchor="start">Không dùng các bộ nhớ cạnh cho cuộn ghi thường khác</text><rect x="40" y="100" width="1520" height="43" fill="#dfe7f0" stroke="#aebed0" stroke-width="1.5"/><text x="55" y="130" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#182333" text-anchor="start">▼  Bảng biến A2 — LỆNH VÀ TRẠNG THÁI CHUNG</text><rect x="52" y="151" width="1496" height="44" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="64" y="178" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#526477" text-anchor="start">HMI chỉ ghi các biến lệnh. CHO PHÉP AUTO và tam_dung chỉ do PLC ghi.</text><rect x="65" y="240" width="1450" height="85" fill="#dfe7f0" stroke="#b8c5d4" stroke-width="1.5"/><text x="75" y="275" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">Tên biến / nhóm biến</text><text x="775" y="275" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">Kiểu</text><text x="885" y="275" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">Công dụng</text><rect x="65" y="325" width="1450" height="85" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="350" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">nho_auto_that / nho_stop_that / nho_stop_hmi</text><text x="775" y="350" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Bool</text><text x="885" y="350" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Ba bộ nhớ cạnh mới</text><rect x="65" y="410" width="1450" height="85" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="435" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">xung_auto_that / xung_auto_hmi</text><text x="775" y="435" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Bool</text><text x="885" y="435" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Hai xung START trước khi hợp nhất</text><rect x="65" y="495" width="1450" height="85" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="520" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">xung_stop_that / xung_stop_hmi</text><text x="775" y="520" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Bool</text><text x="885" y="520" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Hai xung STOP trước khi hợp nhất</text><rect x="65" y="580" width="1450" height="85" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="605" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">lenh_auto / lenh_stop</text><text x="775" y="605" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Bool</text><text x="885" y="605" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Xung lệnh chung từ hai nguồn</tex