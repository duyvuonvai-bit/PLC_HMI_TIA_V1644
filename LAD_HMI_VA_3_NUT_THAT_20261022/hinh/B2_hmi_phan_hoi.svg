<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130"><rect x="0" y="0" width="1600" height="1130" fill="white" stroke="white" stroke-width="0"/><text x="45" y="45" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#153e66" text-anchor="start">Cấu hình HMI B2 — HIỂN THỊ TRẠNG THÁI CHUNG</text><text x="45" y="78" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#18559a" text-anchor="start">Nhấn nút thật thì HMI phải đổi trạng thái theo PLC</text><rect x="40" y="100" width="1520" height="43" fill="#dfe7f0" stroke="#aebed0" stroke-width="1.5"/><text x="55" y="130" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#182333" text-anchor="start">▼  Cấu hình HMI B2 — HIỂN THỊ TRẠNG THÁI CHUNG</text><rect x="52" y="151" width="1496" height="44" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="64" y="178" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#526477" text-anchor="start">Không dùng hmi_stop để tô màu trạng thái dừng; không dùng chon_auto_hmi để tô màu AUTO.</text><rect x="65" y="240" width="1450" height="90" fill="#dfe7f0" stroke="#b8c5d4" stroke-width="1.5"/><text x="75" y="275" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">HMI tag</text><text x="635" y="275" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">Nguồn PLC</text><text x="1045" y="275" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">Công dụng</text><rect x="65" y="330" width="1450" height="90" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="355" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">HMI_AUTO</text><text x="635" y="355" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">CHO PHÉP AUTO</text><text x="1045" y="355" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Đèn/nút AUTO phản hồi chế độ chung</text><rect x="65" y="420" width="1450" height="90" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="445" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">HMI_TAM_DUNG (mới)</text><text x="635" y="445" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">tam_dung</text><text x="1045" y="445" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Đổi chữ TẠM DỪNG / TIẾP TỤC; báo đang dừng</text><rect x="65" y="510" width="1450" height="90" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="535" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">HMI_BUOC / HMI_CONLAI</text><text x="635" y="535" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">BƯỚC HIỆN TẠI / thoigianconlai</text><text x="1045" y="535" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Giữ như hiện tại</text><rect x="65" y="600" width="1450" height="90" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="625" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">HMI_BOM / HMI_VAN1…4 / HMI_LOI</text><text x="635" y="625" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Q0.0…Q0.5</text><text x="1045" y="625" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Giữ như hiện tại</text><rect x="65" y="690" width="1450" height="90" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="715" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">HMI_DU_NUOC</text><text x="635" y="715" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">hmi_du_nuoc</text><text x="1045" y="715" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Giữ tín hiệu giả lập mức nước</text><rect x="65" y="780" width="1450" height="90" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="805" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">HMI_QUA_TAI / HMI_DUNG_KHAN</text><text x="635" y="805" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">hmi_qua_tai / hmi_dung_khan</text><text x="1045" y="805" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Giữ tín hiệu giả lập bảo vệ</text><text x="80" y="940" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#18559a" text-anchor="start">Các công tắc giả lập nước/quá tải/dừng khẩn vẫn giữ trạng thái; không đổi thành nhấn nhả.</text><text x="80" y="995" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#182333" text-anchor="start">Đèn AUTO không chứng minh bơm đang chạy: còn phụ thuộc lịch, tạm dừng và điều kiện bảo vệ.</text><text x="45" y="1087" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#526477" text-anchor="start">LAD cho mô hình sáu đèn · Dây xanh là màu minh họa, không phải trạng thái online.</text><text x="45" y="1112" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#526477" text-anchor="start">Vẽ lại để nhập/đối chiếu trong TIA V16; chưa Compile hoặc chạy trên CPU Siemens.</text><text x="1555" y="1112" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#526477" text-anchor="end">Trang 34</text></svg>