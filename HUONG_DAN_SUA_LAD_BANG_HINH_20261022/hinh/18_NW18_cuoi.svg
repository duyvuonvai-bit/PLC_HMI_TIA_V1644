"310" stroke="#17944b" stroke-width="2.5"/><rect x="1060" y="258" width="170" height="128" fill="#eef2f7" stroke="#8799af" stroke-width="1.8"/><text x="1145.0" y="276" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#182333" text-anchor="middle">MOVE</text><text x="1069" y="315" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#182333" text-anchor="start">EN</text><text x="1221" y="315" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#182333" text-anchor="end">ENO</text><line x1="1042" y1="310" x2="1060" y2="310" stroke="#17944b" stroke-width="2.5"/><line x1="1230" y1="310" x2="1252" y2="310" stroke="#17944b" stroke-width="2.5"/><line x1="1036" y1="350" x2="1060" y2="350" stroke="#17944b" stroke-width="2.5"/><text x="1069" y="355" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#182333" text-anchor="start">IN</text><text x="1028" y="344" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#18559a" text-anchor="end">0</text><line x1="1230" y1="350" x2="1254" y2="350" stroke="#17944b" stroke-width="2.5"/><text x="1221" y="355" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#182333" text-anchor="end">OUT1</text><text x="1262" y="324" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#18559a" text-anchor="start">&quot;daiphunnuoc&quot;.</text><text x="1262" y="344" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#18559a" text-anchor="start">thoigianconlai</text><line x1="70" y1="190" x2="70" y2="450" stroke="#17944b" stroke-width="3.2"/><text x="85" y="560" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#182333" text-anchor="start">Giữ nguyên nhánh trên nếu chỉ áp dụng tối ưu và đổi tên ở tài liệu này.</text><text x="85" y="615" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#182333" text-anchor="start">Không xóa thoigianconlai: đây là biến Int đưa số giây lên HMI.</text><text x="85" y="690" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#18559a" text-anchor="start">Nếu đã áp dụng bản 17 Network trước đó:</text><text x="85" y="740" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#182333" text-anchor="start">Giữ thêm hai nhánh “bước &lt; 1” và “bước &gt; 5” đã bổ sung để hiển thị 0.</text><text x="85" y="790" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#182333" text-anchor="start">Đó là chỉnh hiển thị riêng; không được bỏ nhầm khi chỉ đổi tên biến.</text><text x="45" y="1087" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#526477" text-anchor="start">Theo V1644 · Dây xanh là màu minh họa, không biểu diễn trạng thái online.</text><text x="45" y="1112" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#526477" text-anchor="start">Sơ đồ vẽ lại để nhập/đối chiếu; chưa Compile hoặc chạy trong TIA Portal.</text><text x="1555" y="1112" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#526477" text-anchor="end">Trang 18</text></svg>