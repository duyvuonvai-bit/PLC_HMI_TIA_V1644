<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130"><rect x="0" y="0" width="1600" height="1130" fill="white" stroke="white" stroke-width="0"/><text x="45" y="45" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700" fill="#153e66" text-anchor="start">Network 16 — BỎ NHÁNH XÓA CỜ KHỞI TẠO</text><text x="45" y="79" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#18559a" text-anchor="start">CHI TIẾT CUỐI NETWORK: các nhánh ngõ ra còn lại giữ nguyên</text><rect x="40" y="101" width="1520" height="42" fill="#dfe7f0" stroke="#aebed0" stroke-width="1.5"/><text x="55" y="130" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#182333" text-anchor="start">▼  Network 16 — BỎ NHÁNH XÓA CỜ KHỞI TẠO</text><rect x="52" y="151" width="1496" height="43" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="64" y="178" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#526477" text-anchor="start">Không xóa cả Network 16. Đây chỉ là nhánh cuối, sau khi đã tính van và bơm.</text><line x1="70" y1="320" x2="1490" y2="320" stroke="#17944b" stroke-width="2.5"/><rect x="1336" y="300" width="68" height="40" fill="white" stroke="white" stroke-width="0"/><text x="1347" y="332" font-family="DejaVu Sans,Arial,sans-serif" font-size="38" font-weight="400" fill="#17944b" text-anchor="middle">(</text><text x="1393" y="332" font-family="DejaVu Sans,Arial,sans-serif" font-size="38" font-weight="400" fill="#17944b" text-anchor="middle">)</text><text x="1370" y="327" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#182333" text-anchor="middle">R</text><text x="1370" y="268" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="middle">&quot;daiphunnuoc&quot;.</text><text x="1370" y="289" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="middle">&quot;KHỞI TẠO CHỜ&quot;</text><rect x="1235" y="232" width="270" height="119" fill="none" stroke="#b52330" stroke-width="1.7"/><text x="1240" y="225" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="700" fill="#b52330" text-anchor="start">BỎ NHÁNH NÀY</text><line x1="70" y1="190" x2="70" y2="400" stroke="#17944b" stroke-width="3.2"/><text x="85" y="515" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#b52330" text-anchor="start">XÓA RIÊNG NHÁNH TRÊN Ở CUỐI NW16.</text><text x="85" y="565" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#18559a" text-anchor="start">Giữ nguyên bốn nhánh VAN 1…4 và nhánh BƠM P1 phía trước.</text><text x="85" y="635" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#182333" text-anchor="start">Thứ tự sau sửa:</text><text x="115" y="690" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#18559a" text-anchor="start">VAN 1 → VAN 2 → VAN 3 → VAN 4 → BƠM P1</text><text x="85" y="790" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#182333" text-anchor="start">Chỉ xóa biến KHỞI TẠO CHỜ khỏi DB sau khi sửa NW1, NW5, NW7</text><text x="85" y="825" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#182333" text-anchor="start">và Cross-references xác nhận không còn nơi sử dụng khác.</text><text x="45" y="1087" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#526477" text-anchor="start">Theo V1644 · Dây xanh là màu minh họa, không biểu diễn trạng thái online.</text><text x="45" y="1112" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#526477" text-anchor="start">Sơ đồ vẽ lại để nhập/đối chiếu; chưa Compile hoặc chạy trong TIA Portal.</text><text x="1555" y="1112" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" 