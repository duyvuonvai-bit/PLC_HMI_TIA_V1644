<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130"><rect x="0" y="0" width="1600" height="1130" fill="white" stroke="white" stroke-width="0"/><text x="45" y="45" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#153e66" text-anchor="start">Network 12 — TẠM DỪNG / TIẾP TỤC DÙNG CHUNG</text><text x="45" y="78" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#18559a" text-anchor="start">STOP thật và STOP HMI cùng tác động lên tam_dung</text><rect x="40" y="100" width="1520" height="43" fill="#dfe7f0" stroke="#aebed0" stroke-width="1.5"/><text x="55" y="130" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#182333" text-anchor="start">▼  Network 12 — TẠM DỪNG / TIẾP TỤC DÙNG CHUNG</text><rect x="52" y="151" width="1496" height="44" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="64" y="178" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#526477" text-anchor="start">Từ đây, toàn bộ timer, cập nhật bước và ngõ ra đọc tam_dung; không còn đọc trực tiếp hmi_stop.</text><line x1="70" y1="380" x2="950" y2="380" stroke="#17944b" stroke-width="2.5"/><rect x="261" y="361" width="38" height="38" fill="white" stroke="white" stroke-width="0"/><line x1="269" y1="365" x2="269" y2="395" stroke="#182333" stroke-width="2.4"/><line x1="291" y1="365" x2="291" y2="395" stroke="#182333" stroke-width="2.4"/><text x="280" y="329" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="middle">&quot;daiphunnuoc&quot;.</text><text x="280" y="350" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="middle">tam_dung</text><rect x="641" y="361" width="38" height="38" fill="white" stroke="white" stroke-width="0"/><line x1="649" y1="365" x2="649" y2="395" stroke="#182333" stroke-width="2.4"/><line x1="671" y1="365" x2="671" y2="395" stroke="#182333" stroke-width="2.4"/><line x1="642" y1="398" x2="678" y2="362" stroke="#182333" stroke-width="2.4"/><text x="660" y="329" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="middle">&quot;daiphunnuoc&quot;.</text><text x="660" y="350" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="middle">lenh_stop</text><line x1="70" y1="550" x2="950" y2="550" stroke="#17944b" stroke-width="2.5"/><rect x="261" y="531" width="38" height="38" fill="white" stroke="white" stroke-width="0"/><line x1="269" y1="535" x2="269" y2="565" stroke="#182333" stroke-width="2.4"/><line x1="291" y1="535" x2="291" y2="565" stroke="#182333" stroke-width="2.4"/><line x1="262" y1="568" x2="298" y2="532" stroke="#182333" stroke-width="2.4"/><text x="280" y="499" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="middle">&quot;daiphunnuoc&quot;.</text><text x="280" y="520" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="middle">tam_dung</text><rect x="641" y="531" width="38" height="38" fill="white" stroke="white" stroke-width="0"/><line x1="649" y1="535" x2="649" y2="565" stroke="#182333" stroke-width="2.4"/><line x1="671" y1="535" x2="671" y2="565" stroke="#182333" stroke-width="2.4"/><text x="660" y="499" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="middle">&quot;daiphunnuoc&quot;.</text><text x="660" y="520" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="middle">lenh_stop</text><line x1="950" y1="380" x2="950" y2="550" stroke="#17944b" stroke-width="2.5"/><line x1="950" y1="380" x2="1510" y2="380" stroke="#17944b" stroke-width="2.5"/><rect x="1116" y="361" width="38" height="38" fill="white" stroke="white" stroke-width="0"/><line x1="1124" y1="365" x2="1124" y2="395" stroke="#182333" stroke-width="2.4"/><line x1="1146" y1="365" x2="1146" y2="395" stroke="#182333" stroke-width="2.4"/><text x="1135" y="329" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="middle">&quot;daiphunnuoc&quot;.</text><text x="1135" y="350" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="middle">&quot;CHO PHÉP AUTO&quot;</text><rect x="1366" y="360" width="68" height="40" fill="white" stroke="white" stroke-width="0"/><text x="1377" y="392" font-family="DejaVu Sans,Arial,sans-serif" font-size="38" font-weight="400" fill="#17944b" text-anchor="middle">(</text><text x="1423" y="392" font-family="DejaVu Sans,Arial,sans-serif" font-size="38" font-weight="400" fill="#17944b" text-anchor="middle">)</text><text x="1400" y="328" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="middle">&quot;daiphunnuoc&quot;.</text><text x="1400" y="349" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="middle">tam_dung</text><line x1="70" y1="190" x2="70" y2="670" stroke="#17944b" stroke-width="3.2"/><text x="85" y="800" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18559a" text-anchor="start">Một cuộn thường duy nhất ghi tam_dung; hai nhánh đọc giá trị trước khi cuộn được ghi.</text><text x="85" y="865" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#182333" text-anchor="start">Mỗi lenh_stop làm đảo trạng thái đúng một lần. Không thay bằng hai nhánh S và R liên tiếp.</text><text x="85" y="930" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#182333" text-anchor="start">AUTO mất quyền → tam_dung về 0. Hết ca nhưng AUTO còn → vẫn giữ tạm dừng.</text><text x="45" y="1087" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#526477" text-anchor="start">LAD cho mô hình sáu đèn · Dây xanh là màu minh họa, không phải trạng thái online.</text><text x="45" y="1112" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#526477" text-anchor="start">Vẽ lại để nhập/đối chiếu trong TIA V16; chưa Compile hoặc chạy trên CPU Siemens.</text><text x="1555" y="1112" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#526477" text-anchor="end">Trang 16</text></svg>