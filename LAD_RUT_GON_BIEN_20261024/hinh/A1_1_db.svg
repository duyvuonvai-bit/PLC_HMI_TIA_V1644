<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130"><rect x="0" y="0" width="1600" height="1130" fill="white" stroke="white" stroke-width="0"/><text x="45" y="45" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#153e66" text-anchor="start">Bảng A1 (1/4) — DB daiphunnuoc: 46 BIẾN</text><text x="45" y="78" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#18559a" text-anchor="start">Các dòng 1–12 trong danh mục cuối · Không Retain</text><rect x="40" y="100" width="1520" height="43" fill="#dfe7f0" stroke="#aebed0" stroke-width="1.5"/><text x="55" y="130" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#182333" text-anchor="start">▼  Bảng A1 (1/4) — DB daiphunnuoc: 46 BIẾN</text><rect x="52" y="151" width="1496" height="44" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="64" y="178" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#526477" text-anchor="start">Giữ tên biến cũ còn dùng. Giảm từ 52 còn 46 trường so với PDF 22/10; chưa tính các DB timer.</text><rect x="65" y="220" width="1450" height="63" fill="#dfe7f0" stroke="#b8c5d4" stroke-width="1.5"/><text x="75" y="255" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">Tên biến</text><text x="465" y="255" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">Kiểu</text><text x="575" y="255" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">Start value</text><text x="785" y="255" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">Công dụng / thay đổi</text><rect x="65" y="283" width="1450" height="63" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="308" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">GIỜ PLC</text><text x="465" y="308" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">DTL</text><text x="575" y="308" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Mặc định DTL</text><text x="785" y="308" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Giữ; NW6 đọc giờ PLC, NW7 và HMI dùng.</text><rect x="65" y="346" width="1450" height="63" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="371" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">TRẠNG THÁI RTC</text><text x="465" y="371" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Int</text><text x="575" y="371" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">0</text><text x="785" y="371" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Giữ; mã RET_VAL của RD_LOC_T tại NW6.</text><rect x="65" y="409" width="1450" height="63" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="434" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">RTC OK</text><text x="465" y="434" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Bool</text><text x="575" y="434" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">FALSE</text><text x="785" y="434" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Giữ; lệnh đọc giờ hợp lệ với mã 0 hoặc 1.</text><rect x="65" y="472" width="1450" height="63" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="497" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">CA SÁNG</text><text x="465" y="497" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Bool</text><text x="575" y="497" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">FALSE</text><text x="785" y="497" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Giữ; NW7 xác định ca 06:00–08:00; HMI hiển thị.</text><rect x="65" y="535" width="1450" height="63" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="560" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">CA TỐI</text><text x="465" y="560" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Bool</text><text x="575" y="560" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">FALSE</text><text x="785" y="560" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Giữ; NW7 xác định ca 17:00–20:30; HMI hiển thị.</text><rect x="65" y="598" width="1450" height="63" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="623" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">TRONG GIỜ</text><text x="465" y="623" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Bool</text><text x="575" y="623" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">FALSE</text><text x="785" y="623" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Giữ; ca sáng OR ca tối; NW11 và HMI dùng.</text><rect x="65" y="661" width="1450" height="63" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="686" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">AN TOÀN</text><text x="465" y="686" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Bool</text><text x="575" y="686" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">FALSE</text><text x="785" y="686" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Giữ; NW8 tổng hợp nước, quá tải, dừng khẩn giả lập.</text><rect x="65" y="724" width="1450" height="63" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="749" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">LỖI HIỆN TẠI</text><text x="465" y="749" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Bool</text><text x="575" y="749" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">FALSE</text><text x="785" y="749" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Giữ; NW8 ghi, NW10 chốt vào NHỚ LỖI.</text><rect x="65" y="787" width="1450" height="63" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="812" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">NHỚ LỖI</text><text x="465" y="812" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Bool</text><text x="575" y="812" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">FALSE</text><text x="785" y="812" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Giữ; SR tại NW10; chỉ xóa khi RESET hợp lệ.</text><rect x="65" y="850" width="1450" height="63" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="875" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">XUNG AUTO</text><text x="465" y="875" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Bool</text><text x="575" y="875" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">FALSE</text><text x="785" y="875" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Giữ; bộ nhớ cạnh P riêng của AUTO HMI tại NW4.</text><rect x="65" y="913" width="1450" height="63" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="938" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">XÁC NHẬN LỖI</text><text x="465" y="938" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Bool</text><text x="575" y="938" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">FALSE</text><text x="785" y="938" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Giữ; NW9 tính điều kiện xóa nhớ lỗi.</text><rect x="65" y="976" width="1450" height="63" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="1001" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">HỦY PHÉP CHẠY</text><text x="465" y="1001" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Bool</text><text x="575" y="1001" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">FALSE</text><text x="785" y="1001" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Giữ; NW11 tổng hợp RESET, TẮT, lỗi và FirstScan.</text><text x="45" y="1087" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#526477" text-anchor="start">LAD cho mô hình sáu đèn · Dây xanh là màu minh họa, không phải trạng thái online.</text><text x="45" y="1112" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#526477" text-anchor="start">Vẽ lại để nhập/đối chiếu trong TIA V16; chưa Compile hoặc chạy trên CPU Siemens.</text><text x="1555" y="1112" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#526477" text-anchor="end">Trang 30</text></svg>