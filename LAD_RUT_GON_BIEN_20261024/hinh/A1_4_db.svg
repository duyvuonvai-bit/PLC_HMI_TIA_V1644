<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130"><rect x="0" y="0" width="1600" height="1130" fill="white" stroke="white" stroke-width="0"/><text x="45" y="45" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#153e66" text-anchor="start">Bảng A1 (4/4) — DB daiphunnuoc: 46 BIẾN</text><text x="45" y="78" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#18559a" text-anchor="start">Các dòng 37–46 trong danh mục cuối · Không Retain</text><rect x="40" y="100" width="1520" height="43" fill="#dfe7f0" stroke="#aebed0" stroke-width="1.5"/><text x="55" y="130" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#182333" text-anchor="start">▼  Bảng A1 (4/4) — DB daiphunnuoc: 46 BIẾN</text><rect x="52" y="151" width="1496" height="44" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="64" y="178" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#526477" text-anchor="start">Giữ tên biến cũ còn dùng. Giảm từ 52 còn 46 trường so với PDF 22/10; chưa tính các DB timer.</text><rect x="65" y="220" width="1450" height="63" fill="#dfe7f0" stroke="#b8c5d4" stroke-width="1.5"/><text x="75" y="255" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">Tên biến</text><text x="465" y="255" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">Kiểu</text><text x="575" y="255" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">Start value</text><text x="785" y="255" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">Công dụng / thay đổi</text><rect x="65" y="283" width="1450" height="63" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="308" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">nut_stop_da_loc</text><text x="465" y="308" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Bool</text><text x="575" y="308" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">FALSE</text><text x="785" y="308" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Mới; STOP thật sau lọc nhấn và nhả 30 ms.</text><rect x="65" y="346" width="1450" height="63" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="371" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">nut_reset_da_loc</text><text x="465" y="371" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Bool</text><text x="575" y="371" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">FALSE</text><text x="785" y="371" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Mới; RESET thật sau lọc nhấn và nhả 30 ms.</text><rect x="65" y="409" width="1450" height="63" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="434" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">da_nha_lenh</text><text x="465" y="434" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Bool</text><text x="575" y="434" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">FALSE</text><text x="785" y="434" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Mới; cho nhận START/STOP sau khi nhả lệnh lúc vào RUN.</text><rect x="65" y="472" width="1450" height="63" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="497" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">nho_auto_that</text><text x="465" y="497" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Bool</text><text x="575" y="497" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">FALSE</text><text x="785" y="497" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Mới; bộ nhớ cạnh P riêng của START thật.</text><rect x="65" y="535" width="1450" height="63" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="560" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">nho_stop_that</text><text x="465" y="560" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Bool</text><text x="575" y="560" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">FALSE</text><text x="785" y="560" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Mới; bộ nhớ cạnh P riêng của STOP thật.</text><rect x="65" y="598" width="1450" height="63" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="623" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">nho_stop_hmi</text><text x="465" y="623" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Bool</text><text x="575" y="623" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">FALSE</text><text x="785" y="623" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Mới; bộ nhớ cạnh P riêng của STOP HMI.</text><rect x="65" y="661" width="1450" height="63" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="686" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">lenh_auto</text><text x="465" y="686" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Bool</text><text x="575" y="686" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">FALSE</text><text x="785" y="686" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Mới; NW4 hợp hai cạnh START, sau cổng da_nha_lenh.</text><rect x="65" y="724" width="1450" height="63" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="749" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">lenh_stop</text><text x="465" y="749" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Bool</text><text x="575" y="749" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">FALSE</text><text x="785" y="749" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Mới; NW4 hợp hai cạnh STOP, sau cổng da_nha_lenh.</text><rect x="65" y="787" width="1450" height="63" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="812" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">lenh_tat_hmi</text><text x="465" y="812" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Bool</text><text x="575" y="812" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">FALSE</text><text x="785" y="812" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Mới; lệnh TẮT nhấn nhả từ HMI; PLC chỉ đọc.</text><rect x="65" y="850" width="1450" height="63" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="875" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">tam_dung</text><text x="465" y="875" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Bool</text><text x="575" y="875" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">FALSE</text><text x="785" y="875" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Mới; trạng thái tạm dừng chung do PLC giữ ở NW12.</text><text x="45" y="1087" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#526477" text-anchor="start">LAD cho mô hình sáu đèn · Dây xanh là màu minh họa, không phải trạng thái online.</text><text x="45" y="1112" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#526477" text-anchor="start">Vẽ lại để nhập/đối chiếu trong TIA V16; chưa Compile hoặc chạy trên CPU Siemens.</text><text x="1555" y="1112" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#526477" text-anchor="end">Trang 33</text></svg>