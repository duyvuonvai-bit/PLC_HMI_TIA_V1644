<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130"><rect x="0" y="0" width="1600" height="1130" fill="white" stroke="white" stroke-width="0"/><text x="45" y="45" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#153e66" text-anchor="start">Bảng A4 (2/2) — TAG CHỈ XÓA SAU KIỂM TRA</text><text x="45" y="78" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#18559a" text-anchor="start">Không kết luận một tag HMI thừa chỉ vì không xuất hiện trong LAD</text><rect x="40" y="100" width="1520" height="43" fill="#dfe7f0" stroke="#aebed0" stroke-width="1.5"/><text x="55" y="130" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#182333" text-anchor="start">▼  Bảng A4 (2/2) — TAG CHỈ XÓA SAU KIỂM TRA</text><rect x="52" y="151" width="1496" height="44" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="64" y="178" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#526477" text-anchor="start">Kiểm tra Cross-references, Events, Animations và Scripts; các nguồn vào thật chưa đấu được xem là dự phòng.</text><rect x="65" y="240" width="1450" height="125" fill="#dfe7f0" stroke="#b8c5d4" stroke-width="1.5"/><text x="75" y="275" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">Tag / nhóm tag</text><text x="635" y="275" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">Phân loại</text><text x="925" y="275" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">Cách xử lý</text><rect x="65" y="365" width="1450" height="125" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="390" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">HMI_DUNUOC</text><text x="635" y="390" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">HMI: xóa có điều kiện</text><text x="925" y="390" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Đổi các đối tượng giả lập sang HMI_DU_NUOC; kiểm tra tham chiếu rồi</text><text x="925" y="410" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">xóa.</text><rect x="65" y="490" width="1450" height="125" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="515" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">HMI_STOP_NHAN</text><text x="635" y="515" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">HMI: xóa có điều kiện</text><text x="925" y="515" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Kiểm tra Events, Animations, Scripts; chỉ xóa nếu không dùng.</text><rect x="65" y="615" width="1450" height="125" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="640" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">ĐỦ NƯỚC / DỪNG KHẨN CẤP / QUÁ TẢI</text><text x="635" y="640" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">PLC: đầu vào dự phòng</text><text x="925" y="640" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">I0.1/I0.3/I0.4 chưa dùng ở bản giả lập; giữ nếu dự kiến đấu thật.</text><rect x="65" y="740" width="1450" height="125" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="765" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">System_Byte / DiagStatusUpdate / AlwaysTRUE / AlwaysFALSE</text><text x="635" y="765" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">PLC: tên hệ thống</text><text x="925" y="765" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Có thể bỏ alias nếu không dùng; vẫn giữ cấu hình MB1 và FirstScan.</text><text x="80" y="930" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18559a" text-anchor="start">HMI_DUNUOC và HMI_DU_NUOC không cùng nguồn: I0.1 và DB hmi_du_nuoc.</text><text x="80" y="990" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#182333" text-anchor="start">Bảng HMI chốt dùng HMI_DU_NUOC. Chuyển liên kết các đối tượng trước khi xóa tag cũ.</text><text x="80" y="1050" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#182333" text-anchor="start">Giữ tên FirstScan và cấu hình MB1, kể cả khi bỏ các tên mặc định khác của byte hệ thống.</text><text x="45" y="1087" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#526477" text-anchor="start">LAD cho mô hình sáu đèn · Dây xanh là màu minh họa, không phải trạng thái online.</text><text x="45" y="1112" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#526477" text-anchor="start">Vẽ lại để nhập/đối chiếu trong TIA V16; chưa Compile hoặc chạy trên CPU Siemens.</text><text x="1555" y="1112" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#526477" text-anchor="end">Trang 36</text></svg>