<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130"><rect x="0" y="0" width="1600" height="1130" fill="white" stroke="white" stroke-width="0"/><text x="45" y="45" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#153e66" text-anchor="start">Bảng A2 — INSTANCE TIMER</text><text x="45" y="78" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#18559a" text-anchor="start">Bảy TON mới phục vụ nút nhấn; năm TONR cũ phục vụ chu trình</text><rect x="40" y="100" width="1520" height="43" fill="#dfe7f0" stroke="#aebed0" stroke-width="1.5"/><text x="55" y="130" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#182333" text-anchor="start">▼  Bảng A2 — INSTANCE TIMER</text><rect x="52" y="151" width="1496" height="44" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="64" y="178" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#526477" text-anchor="start">Lọc cả nhấn và nhả để STOP không bị đảo nhiều lần do tiếp điểm dội ngắn.</text><rect x="65" y="240" width="1450" height="95" fill="#dfe7f0" stroke="#b8c5d4" stroke-width="1.5"/><text x="75" y="275" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">Instance</text><text x="725" y="275" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">Lệnh</text><text x="865" y="275" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">PT</text><text x="1035" y="275" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">Công dụng</text><rect x="65" y="335" width="1450" height="95" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="360" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">loc_auto_nhan / loc_auto_nha</text><text x="725" y="360" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">TON</text><text x="865" y="360" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">T#30ms</text><text x="1035" y="360" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Lọc START</text><rect x="65" y="430" width="1450" height="95" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="455" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">loc_stop_nhan / loc_stop_nha</text><text x="725" y="455" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">TON</text><text x="865" y="455" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">T#30ms</text><text x="1035" y="455" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Lọc STOP</text><rect x="65" y="525" width="1450" height="95" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="550" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">loc_reset_nhan / loc_reset_nha</text><text x="725" y="550" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">TON</text><text x="865" y="550" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">T#30ms</text><text x="1035" y="550" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Lọc RESET</text><rect x="65" y="620" width="1450" height="95" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="645" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">cho_nha_lenh</text><text x="725" y="645" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">TON</text><text x="865" y="645" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">T#30ms</text><text x="1035" y="645" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Chờ nhả lệnh khi CPU vào RUN</text><rect x="65" y="715" width="1450" height="95" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="740" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">buoc1…buoc5 (đã có)</text><text x="725" y="740" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">TONR</text><text x="865" y="740" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">T#10s</text><text x="1035" y="740" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Giữ DB2…DB6 của năm bước</text><text x="80" y="880" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18559a" text-anchor="start">Các TON mới: để TIA cấp số DB chưa sử dụng. Không ép trùng DB2…DB6.</text><text x="80" y="935" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#182333" text-anchor="start">Mỗi instance chỉ được gọi một lần mỗi vòng quét; các DB timer không Retain.</text><text x="45" y="1087" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#526477" text-anchor="start">LAD cho mô hình sáu đèn · Dây xanh là màu minh họa, không phải trạng thái online.</text><text x="45" y="1112" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#526477" text-anchor="start">Vẽ lại để nhập/đối chiếu trong TIA V16; chưa Compile hoặc chạy trên CPU Siemens.</text><text x="1555" y="1112" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#526477" text-anchor="end">Trang 34</text></svg>