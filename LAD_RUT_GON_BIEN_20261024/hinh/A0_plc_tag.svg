<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130"><rect x="0" y="0" width="1600" height="1130" fill="white" stroke="white" stroke-width="0"/><text x="45" y="45" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#153e66" text-anchor="start">Bảng A0 — PLC TAG DÙNG TRONG BẢN RÚT GỌN</text><text x="45" y="78" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#18559a" text-anchor="start">Ba đầu vào, sáu đầu ra và FirstScan</text><rect x="40" y="100" width="1520" height="43" fill="#dfe7f0" stroke="#aebed0" stroke-width="1.5"/><text x="55" y="130" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#182333" text-anchor="start">▼  Bảng A0 — PLC TAG DÙNG TRONG BẢN RÚT GỌN</text><rect x="52" y="151" width="1496" height="44" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="64" y="178" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#526477" text-anchor="start">Giữ nguyên địa chỉ của bản cũ. Bật System memory byte MB1 để FirstScan đúng là xung vòng quét đầu.</text><rect x="65" y="240" width="1450" height="67" fill="#dfe7f0" stroke="#b8c5d4" stroke-width="1.5"/><text x="75" y="275" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">PLC tag</text><text x="495" y="275" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">Kiểu</text><text x="605" y="275" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">Địa chỉ</text><text x="795" y="275" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">Công dụng</text><rect x="65" y="307" width="1450" height="67" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="332" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">CHỌN AUTO</text><text x="495" y="332" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Bool</text><text x="605" y="332" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">%I0.0</text><text x="795" y="332" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">START thật, tiếp điểm NO.</text><rect x="65" y="374" width="1450" height="67" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="399" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">NÚT RESET</text><text x="495" y="399" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Bool</text><text x="605" y="399" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">%I0.2</text><text x="795" y="399" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">RESET thật, tiếp điểm NO.</text><rect x="65" y="441" width="1450" height="67" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="466" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">NÚT DỪNG</text><text x="495" y="466" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Bool</text><text x="605" y="466" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">%I0.5</text><text x="795" y="466" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">STOP thật, NO/NC theo stop_thuong_dong.</text><rect x="65" y="508" width="1450" height="67" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="533" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">BƠM P1</text><text x="495" y="533" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Bool</text><text x="605" y="533" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">%Q0.0</text><text x="795" y="533" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Đèn mô phỏng bơm.</text><rect x="65" y="575" width="1450" height="67" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="600" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">VAN 1</text><text x="495" y="600" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Bool</text><text x="605" y="600" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">%Q0.1</text><text x="795" y="600" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Đèn mô phỏng van 1.</text><rect x="65" y="642" width="1450" height="67" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="667" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">VAN 2</text><text x="495" y="667" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Bool</text><text x="605" y="667" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">%Q0.2</text><text x="795" y="667" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Đèn mô phỏng van 2.</text><rect x="65" y="709" width="1450" height="67" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="734" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">VAN 3</text><text x="495" y="734" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Bool</text><text x="605" y="734" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">%Q0.3</text><text x="795" y="734" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Đèn mô phỏng van 3.</text><rect x="65" y="776" width="1450" height="67" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="801" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">VAN 4</text><text x="495" y="801" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Bool</text><text x="605" y="801" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">%Q0.4</text><text x="795" y="801" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Đèn mô phỏng van 4.</text><rect x="65" y="843" width="1450" height="67" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="868" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">ĐÈN BÁO LỖI</text><text x="495" y="868" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Bool</text><text x="605" y="868" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">%Q0.5</text><text x="795" y="868" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Đèn lỗi từ trạng thái NHỚ LỖI.</text><rect x="65" y="910" width="1450" height="67" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="935" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">FirstScan</text><text x="495" y="935" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Bool</text><text x="605" y="935" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">%M1.0</text><text x="795" y="935" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Bật System memory byte MB1; không ghi bit này.</text><text x="80" y="1037" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#18559a" text-anchor="start">10 tag cần cho bản này; các tag dự phòng chỉ xóa khi toàn project không còn tham chiếu.</text><text x="45" y="1087" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#526477" text-anchor="start">LAD cho mô hình sáu đèn · Dây xanh là màu minh họa, không phải trạng thái online.</text><text x="45" y="1112" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#526477" text-anchor="start">Vẽ lại để nhập/đối chiếu trong TIA V16; chưa Compile hoặc chạy trên CPU Siemens.</text><text x="1555" y="1112" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#526477" text-anchor="end">Trang 29</text></svg>