a" text-anchor="start">RESET luôn dừng và xóa chu trình; chỉ xóa nhớ lỗi khi các điều kiện trên đã hợp lệ.</text><text x="85" y="815" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#182333" text-anchor="start">Giữ cách xác nhận theo mức RESET của V1644. Không ép xóa lỗi khi nguyên nhân còn tồn tại.</text><text x="45" y="1087" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#526477" text-anchor="start">LAD cho mô hình sáu đèn · Dây xanh là màu minh họa, không phải trạng thái online.</text><text x="45" y="1112" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#526477" text-anchor="start">Vẽ lại để nhập/đối chiếu trong TIA V16; chưa Compile hoặc chạy trên CPU Siemens.</text><text x="1555" y="1112" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#526477" text-anchor="end">Trang 12</text></svg>