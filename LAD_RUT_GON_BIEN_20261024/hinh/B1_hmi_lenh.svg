<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130"><rect x="0" y="0" width="1600" height="1130" fill="white" stroke="white" stroke-width="0"/><text x="45" y="45" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#153e66" text-anchor="start">Cấu hình HMI B1 — SỰ KIỆN BỐN NÚT LỆNH</text><text x="45" y="78" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#18559a" text-anchor="start">Events của từng nút: Press → SetBit; Release → ResetBit</text><rect x="40" y="100" width="1520" height="43" fill="#dfe7f0" stroke="#aebed0" stroke-width="1.5"/><text x="55" y="130" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#182333" text-anchor="start">▼  Cấu hình HMI B1 — SỰ KIỆN BỐN NÚT LỆNH</text><rect x="52" y="151" width="1496" height="44" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="64" y="178" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#526477" text-anchor="start">Đổi sự kiện trên nút cũ và đổi nguồn hiển thị theo trang B2. Không chỉ thêm nút thật vào LAD.</text><rect x="65" y="240" width="1450" height="100" fill="#dfe7f0" stroke="#b8c5d4" stroke-width="1.5"/><text x="75" y="275" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">Nút</text><text x="335" y="275" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">HMI tag</text><text x="695" y="275" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">Biến DB PLC</text><text x="1045" y="275" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">Press</text><text x="1285" y="275" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">Release</text><rect x="65" y="340" width="1450" height="100" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="365" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">AUTO</text><text x="335" y="365" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">chon_auto_hmi</text><text x="695" y="365" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">chon_auto_hmi</text><text x="1045" y="365" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">SetBit</text><text x="1285" y="365" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">ResetBit</text><rect x="65" y="440" width="1450" height="100" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="465" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">TẮT</text><text x="335" y="465" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">HMI_TAT_NHAN (mới)</text><text x="695" y="465" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">lenh_tat_hmi</text><text x="1045" y="465" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">SetBit</text><text x="1285" y="465" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">ResetBit</text><rect x="65" y="540" width="1450" height="100" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="565" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">STOP / TIẾP TỤC</text><text x="335" y="565" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">HMI_STOP</text><text x="695" y="565" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">hmi_stop</text><text x="1045" y="565" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">SetBit</text><text x="1285" y="565" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">ResetBit</text><rect x="65" y="640" width="1450" height="100" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="665" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">RESET</text><text x="335" y="665" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">HMI_RESET_NHAN</text><text x="695" y="665" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">hmi_reset</text><text x="1045" y="665" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">SetBit</text><text x="1285" y="665" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">ResetBit</text><text x="80" y="805" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#18559a" text-anchor="start">Tất cả bốn lệnh là nhấn nhả: nhấn ghi 1, nhả ghi 0. Không dùng InvertBit cho hmi_stop.</text><text x="80" y="860" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#182333" text-anchor="start">Nút TẮT không còn ResetBit chon_auto_hmi; nó gửi lệnh riêng lenh_tat_hmi.</text><text x="80" y="915" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#182333" text-anchor="start">HMI tag phải là External tag, đúng kết nối PLC thật. PLC không ghi trả vào bốn bit lệnh.</text><text x="80" y="970" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#182333" text-anchor="start">Khi thử, giữ nút vài trăm ms để PLC nhận được mức 1 qua chu kỳ truyền thông.</text><text x="80" y="1025" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#182333" text-anchor="start">Nếu mất kết nối lúc giữ TẮT/RESET, bit có thể còn 1: kiểm tra và đưa lệnh về 0 khi kết nối lại.</text><text x="45" y="1087" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#526477" text-anchor="start">LAD cho mô hình sáu đèn · Dây xanh là màu minh họa, không phải trạng thái online.</text><text x="45" y="1112" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#526477" text-anchor="start">Vẽ lại để nhập/đối chiếu trong TIA V16; chưa Compile hoặc chạy trên CPU Siemens.</text><text x="1555" y="1112" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#526477" text-anchor="end">Trang 38</text></svg>