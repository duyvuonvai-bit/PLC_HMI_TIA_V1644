<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130"><rect x="0" y="0" width="1600" height="1130" fill="white" stroke="white" stroke-width="0"/><text x="45" y="45" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#153e66" text-anchor="start">Bảng A1 (2/4) — DB daiphunnuoc: 46 BIẾN</text><text x="45" y="78" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#18559a" text-anchor="start">Các dòng 13–24 trong danh mục cuối · Không Retain</text><rect x="40" y="100" width="1520" height="43" fill="#dfe7f0" stroke="#aebed0" stroke-width="1.5"/><text x="55" y="130" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#182333" text-anchor="start">▼  Bảng A1 (2/4) — DB daiphunnuoc: 46 BIẾN</text><rect x="52" y="151" width="1496" height="44" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="64" y="178" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#526477" text-anchor="start">Giữ tên biến cũ còn dùng. Giảm từ 52 còn 46 trường so với PDF 22/10; chưa tính các DB timer.</text><rect x="65" y="220" width="1450" height="63" fill="#dfe7f0" stroke="#b8c5d4" stroke-width="1.5"/><text x="75" y="255" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">Tên biến</text><text x="465" y="255" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">Kiểu</text><text x="575" y="255" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">Start value</text><text x="785" y="255" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">Công dụng / thay đổi</text><rect x="65" y="283" width="1450" height="63" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="308" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">CHO PHÉP AUTO</text><text x="465" y="308" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Bool</text><text x="575" y="308" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">FALSE</text><text x="785" y="308" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Giữ; trạng thái AUTO chung do PLC giữ; HMI chỉ đọc.</text><rect x="65" y="346" width="1450" height="63" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="371" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">TỰ ĐỘNG CHẠY</text><text x="465" y="371" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Bool</text><text x="575" y="371" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">FALSE</text><text x="785" y="371" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Giữ; AUTO được cấp và đang trong giờ vận hành.</text><rect x="65" y="409" width="1450" height="63" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="434" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">BƯỚC HIỆN TẠI</text><text x="465" y="434" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Int</text><text x="575" y="434" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">0</text><text x="785" y="434" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Giữ; NW19 chốt bước; timer, van và HMI đọc.</text><rect x="65" y="472" width="1450" height="63" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="497" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">BƯỚC TIẾP THEO</text><text x="465" y="497" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Int</text><text x="575" y="497" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">0</text><text x="785" y="497" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Giữ; chuẩn bị/chuyển bước trước khi NW19 chốt.</text><rect x="65" y="535" width="1450" height="63" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="560" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">etbuoc1</text><text x="465" y="560" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Time</text><text x="575" y="560" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">T#0ms</text><text x="785" y="560" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Giữ; bản sao ET của TONR buoc1, dùng ở NW21.</text><rect x="65" y="598" width="1450" height="63" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="623" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">etbuoc2</text><text x="465" y="623" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Time</text><text x="575" y="623" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">T#0ms</text><text x="785" y="623" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Giữ; bản sao ET của TONR buoc2, dùng ở NW21.</text><rect x="65" y="661" width="1450" height="63" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="686" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">etbuoc3</text><text x="465" y="686" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Time</text><text x="575" y="686" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">T#0ms</text><text x="785" y="686" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Giữ; bản sao ET của TONR buoc3, dùng ở NW21.</text><rect x="65" y="724" width="1450" height="63" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="749" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">etbuoc4</text><text x="465" y="749" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Time</text><text x="575" y="749" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">T#0ms</text><text x="785" y="749" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Giữ; bản sao ET của TONR buoc4, dùng ở NW21.</text><rect x="65" y="787" width="1450" height="63" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="812" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">etbuoc5</text><text x="465" y="812" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Time</text><text x="575" y="812" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">T#0ms</text><text x="785" y="812" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Giữ; bản sao ET của TONR buoc5, dùng ở NW21.</text><rect x="65" y="850" width="1450" height="63" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="875" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">etdangchay</text><text x="465" y="875" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Time</text><text x="575" y="875" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">T#0ms</text><text x="785" y="875" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Giữ; NW21 chọn ET của bước hiện tại.</text><rect x="65" y="913" width="1450" height="63" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="938" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">etms</text><text x="465" y="938" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">DInt</text><text x="575" y="938" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">0</text><text x="785" y="938" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Giữ; kết quả T_CONV, số mili giây đã chạy.</text><rect x="65" y="976" width="1450" height="63" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="1001" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">giaydachay</text><text x="465" y="1001" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">DInt</text><text x="575" y="1001" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">0</text><text x="785" y="1001" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Giữ; kết quả chia etms cho 1000 tại NW22.</text><text x="45" y="1087" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#526477" text-anchor="start">LAD cho mô hình sáu đèn · Dây xanh là màu minh họa, không phải trạng thái online.</text><text x="45" y="1112" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#526477" text-anchor="start">Vẽ lại để nhập/đối chiếu trong TIA V16; chưa Compile hoặc chạy trên CPU Siemens.</text><text x="1555" y="1112" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#526477" text-anchor="end">Trang 31</text></svg>