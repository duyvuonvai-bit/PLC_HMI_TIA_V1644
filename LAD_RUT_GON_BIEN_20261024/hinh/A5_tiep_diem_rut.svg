<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130"><rect x="0" y="0" width="1600" height="1130" fill="white" stroke="white" stroke-width="0"/><text x="45" y="45" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#153e66" text-anchor="start">Bảng A5 — CÁC TIẾP ĐIỂM LẶP ĐÃ BỎ</text><text x="45" y="78" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#18559a" text-anchor="start">Các kiểm tra bảo vệ chính ở NW8–11 và chân R của timer vẫn giữ nguyên</text><rect x="40" y="100" width="1520" height="43" fill="#dfe7f0" stroke="#aebed0" stroke-width="1.5"/><text x="55" y="130" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#182333" text-anchor="start">▼  Bảng A5 — CÁC TIẾP ĐIỂM LẶP ĐÃ BỎ</text><rect x="52" y="151" width="1496" height="44" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="64" y="178" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#526477" text-anchor="start">Không chuyển bơm lên trước van; không đổi thứ tự timer, chốt bước và hiển thị sau khi đã rút các điều kiện.</text><rect x="65" y="240" width="1450" height="105" fill="#dfe7f0" stroke="#b8c5d4" stroke-width="1.5"/><text x="75" y="275" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">Network</text><text x="255" y="275" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">Đã rút</text><text x="805" y="275" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">Điều kiện bảo đảm tương đương</text><rect x="65" y="345" width="1450" height="105" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="370" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">NW9</text><text x="255" y="370" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Bỏ /LỖI HIỆN TẠI</text><text x="805" y="370" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">AN TOÀN và RTC OK đã loại mọi nguyên nhân lỗi tại NW8.</text><rect x="65" y="450" width="1450" height="105" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="475" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">NW11</text><text x="255" y="475" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Bỏ /HỦY ở chân S và nhánh chạy</text><text x="805" y="475" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">SR ưu tiên R1 đã xóa CHO PHÉP AUTO khi HỦY = 1.</text><rect x="65" y="555" width="1450" height="105" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="580" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">NW14–18</text><text x="255" y="580" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Bỏ TỰ ĐỘNG CHẠY trên nhánh Q→MOVE</text><text x="805" y="580" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Timer vừa được gọi; nếu không chạy thì R đã xóa Q.</text><rect x="65" y="660" width="1450" height="105" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="685" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">NW20</text><text x="255" y="685" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Bỏ ba tiếp điểm lặp trên nhánh bơm</text><text x="805" y="685" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Bốn van vừa tính đã có TỰ ĐỘNG CHẠY và /tam_dung.</text><rect x="65" y="765" width="1450" height="105" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="790" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">NW21</text><text x="255" y="790" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Bỏ TỰ ĐỘNG CHẠY ở năm nhánh chọn ET</text><text x="805" y="790" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Khi không chạy, NW19 đã đưa bước về 0.</text><rect x="65" y="870" width="1450" height="105" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="895" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">NW22</text><text x="255" y="895" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Bỏ nhánh /TỰ ĐỘNG CHẠY ghi 0</text><text x="805" y="895" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Bước 0 đã được bao phủ bởi phép so sánh bước &lt; 1.</text><text x="80" y="1030" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#18559a" text-anchor="start">Dấu / chỉ tiếp điểm thường đóng. Giữ thứ tự 1→22 và một nơi ghi trạng thái/ngõ ra như bản vẽ.</text><text x="45" y="1087" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#526477" text-anchor="start">LAD cho mô hình sáu đèn · Dây xanh là màu minh họa, không phải trạng thái online.</text><text x="45" y="1112" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#526477" text-anchor="start">Vẽ lại để nhập/đối chiếu trong TIA V16; chưa Compile hoặc chạy trên CPU Siemens.</text><text x="1555" y="1112" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#526477" text-anchor="end">Trang 37</text></svg>