" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Mới; chỉ đọc trạng thái, đổi chữ TẠM DỪNG/TIẾP TỤC.</text><text x="45" y="1087" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#526477" text-anchor="start">LAD cho mô hình sáu đèn · Dây xanh là màu minh họa, không phải trạng thái online.</text><text x="45" y="1112" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#526477" text-anchor="start">Vẽ lại để nhập/đối chiếu trong TIA V16; chưa Compile hoặc chạy trên CPU Siemens.</text><text x="1555" y="1112" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#526477" text-anchor="end">Trang 41</text></svg>