<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130"><rect x="0" y="0" width="1600" height="1130" fill="white" stroke="white" stroke-width="0"/><text x="45" y="45" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#153e66" text-anchor="start">Bảng A4 (1/2) — BIẾN ĐÃ LOẠI KHỎI BẢN MỚI</text><text x="45" y="78" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#18559a" text-anchor="start">Ba biến của V1644 gốc và sáu biến đệm của bản PDF 22/10</text><rect x="40" y="100" width="1520" height="43" fill="#dfe7f0" stroke="#aebed0" stroke-width="1.5"/><text x="55" y="130" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#182333" text-anchor="start">▼  Bảng A4 (1/2) — BIẾN ĐÃ LOẠI KHỎI BẢN MỚI</text><rect x="52" y="151" width="1496" height="44" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="64" y="178" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#526477" text-anchor="start">Thay đúng các network liên quan trước khi xóa khai báo; kiểm tra mọi tham chiếu PLC/HMI còn lại.</text><rect x="65" y="240" width="1450" height="76" fill="#dfe7f0" stroke="#b8c5d4" stroke-width="1.5"/><text x="75" y="275" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">Không khai báo trong bản mới</text><text x="495" y="275" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">Nhóm</text><text x="785" y="275" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">Đã thay bằng</text><rect x="65" y="316" width="1450" height="76" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="341" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">CÓ VAN MỞ</text><text x="495" y="341" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">DB cũ</text><text x="785" y="341" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Không dùng trong bản mới; xóa khi toàn project hết tham chiếu.</text><rect x="65" y="392" width="1450" height="76" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="417" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">KHỞI TẠO CHỜ</text><text x="495" y="417" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">DB cũ</text><text x="785" y="417" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Bản mới đọc trực tiếp FirstScan; bỏ các nhánh cũ rồi xóa biến.</text><rect x="65" y="468" width="1450" height="76" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="493" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">ĐÃ GẠT TẮT</text><text x="495" y="493" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">DB cũ</text><text x="785" y="493" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Bỏ khi thay xong cơ chế AUTO cũ bằng START nhấn nhả.</text><rect x="65" y="544" width="1450" height="76" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="569" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">tat_ca_lenh_da_nha</text><text x="495" y="569" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Biến đệm bản trước</text><text x="785" y="569" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">NW3 nối trực tiếp các tiếp điểm vào IN của TON cho_nha_lenh.</text><rect x="65" y="620" width="1450" height="76" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="645" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">nha_lenh_on_dinh</text><text x="495" y="645" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Biến đệm bản trước</text><text x="785" y="645" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">NW3 dùng trực tiếp &quot;cho_nha_lenh&quot;.Q tại chân S.</text><rect x="65" y="696" width="1450" height="76" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="721" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">xung_auto_that</text><text x="495" y="721" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Biến đệm bản trước</text><text x="785" y="721" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">NW4 hợp trực tiếp tiếp điểm P; giữ nho_auto_that.</text><rect x="65" y="772" width="1450" height="76" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="797" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">xung_auto_hmi</text><text x="495" y="797" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Biến đệm bản trước</text><text x="785" y="797" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">NW4 hợp trực tiếp tiếp điểm P; giữ XUNG AUTO.</text><rect x="65" y="848" width="1450" height="76" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="873" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">xung_stop_that</text><text x="495" y="873" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Biến đệm bản trước</text><text x="785" y="873" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">NW4 hợp trực tiếp tiếp điểm P; giữ nho_stop_that.</text><rect x="65" y="924" width="1450" height="76" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="949" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">xung_stop_hmi</text><text x="495" y="949" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">Biến đệm bản trước</text><text x="785" y="949" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#182333" text-anchor="start">NW4 hợp trực tiếp tiếp điểm P; giữ nho_stop_hmi.</text><text x="80" y="1055" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#18559a" text-anchor="start">Sáu biến đệm từng có công dụng; nay đã gộp nhánh để bỏ được. Không xóa riêng trong code cũ.</text><text x="45" y="1087" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#526477" text-anchor="start">LAD cho mô hình sáu đèn · Dây xanh là màu minh họa, không phải trạng thái online.</text><text x="45" y="1112" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#526477" text-anchor="start">Vẽ lại để nhập/đối chiếu trong TIA V16; chưa Compile hoặc chạy trên CPU Siemens.</text><text x="1555" y="1112" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#526477" text-anchor="end">Trang 35</text></svg>