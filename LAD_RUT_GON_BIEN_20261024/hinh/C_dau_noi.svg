<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130"><rect x="0" y="0" width="1600" height="1130" fill="white" stroke="white" stroke-width="0"/><text x="45" y="45" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#153e66" text-anchor="start">Đấu nối C — BA NÚT THẬT VÀ PLC</text><text x="45" y="78" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#18559a" text-anchor="start">Ảnh chưa xác nhận kiểu tiếp điểm; kiểm tra phần cứng trước khi chọn cấu hình</text><rect x="40" y="100" width="1520" height="43" fill="#dfe7f0" stroke="#aebed0" stroke-width="1.5"/><text x="55" y="130" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#182333" text-anchor="start">▼  Đấu nối C — BA NÚT THẬT VÀ PLC</text><rect x="52" y="151" width="1496" height="44" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="64" y="178" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#526477" text-anchor="start">Bản này giả định START/RESET dùng NO. STOP có tham số chọn NO/NC. Không suy đoán chân giắc từ màu nút.</text><rect x="65" y="240" width="1450" height="90" fill="#dfe7f0" stroke="#b8c5d4" stroke-width="1.5"/><text x="75" y="275" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">Thiết bị</text><text x="335" y="275" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">PLC tag</text><text x="695" y="275" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">Địa chỉ</text><text x="945" y="275" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#182333" text-anchor="start">Quy ước</text><rect x="65" y="330" width="1450" height="90" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="355" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">START</text><text x="335" y="355" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">CHỌN AUTO</text><text x="695" y="355" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">%I0.0</text><text x="945" y="355" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">NO: nhấn = 1</text><rect x="65" y="420" width="1450" height="90" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="445" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">STOP</text><text x="335" y="445" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">NÚT DỪNG</text><text x="695" y="445" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">%I0.5</text><text x="945" y="445" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">NO hoặc NC theo stop_thuong_dong</text><rect x="65" y="510" width="1450" height="90" fill="#f7f9fc" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="535" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">RESET</text><text x="335" y="535" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">NÚT RESET</text><text x="695" y="535" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">%I0.2</text><text x="945" y="535" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">NO: nhấn = 1</text><rect x="65" y="600" width="1450" height="90" fill="#ffffff" stroke="#d4dfea" stroke-width="1.5"/><text x="75" y="625" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Ngõ ra mô phỏng</text><text x="335" y="625" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Bơm / Van 1–4 / Lỗi</text><text x="695" y="625" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">%Q0.0…%Q0.5</text><text x="945" y="625" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#182333" text-anchor="start">Giữ sáu đèn như hiện tại</text><text x="80" y="765" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#18559a" text-anchor="start">Với tiếp điểm khô: +24 VDC → tiếp điểm nút → DI tương ứng; common DI về 0 V đúng sơ đồ bộ PLC.</text><text x="80" y="830" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#182333" text-anchor="start">Ngắt nguồn và đo thông mạch để xác định đúng cặp cọc, loại NO/NC trước khi đấu.</text><text x="80" y="895" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#182333" text-anchor="start">Không đưa 220 VAC vào DI 24 VDC. Các công tắc giả lập sẵn trên bộ không được giữ ép DI bằng 1.</text><text x="80" y="960" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#182333" text-anchor="start">Mô hình chỉ sáu đèn: STOP đảo trạng thái là nút vận hành, không thay dừng khẩn phần cứng.</text><text x="80" y="1025" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#182333" text-anchor="start">WinCC Runtime trên PC kết nối IP PLC thật; không dùng PLCSIM để xuất trực tiếp ra sáu đèn.</text><text x="45" y="1087" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#526477" text-anchor="start">LAD cho mô hình sáu đèn · Dây xanh là màu minh họa, không phải trạng thái online.</text><text x="45" y="1112" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#526477" text-anchor="start">Vẽ lại để nhập/đối chiếu trong TIA V16; chưa Compile hoặc chạy trên CPU Siemens.</text><text x="1555" y="1112" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#526477" text-anchor="end">Trang 42</text></svg>