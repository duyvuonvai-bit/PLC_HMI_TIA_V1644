" font-size="17" font-weight="400" fill="#182333" text-anchor="middle">&quot;RTC OK&quot;</text><line x1="70" y1="190" x2="70" y2="880" stroke="#17944b" stroke-width="3.2"/><text x="85" y="975" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#18559a" text-anchor="start">RTC OK xác nhận lệnh đọc hợp lệ; vẫn phải đặt đúng ngày, giờ và múi giờ của PLC.</text><text x="45" y="1087" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#526477" text-anchor="start">LAD cho mô hình sáu đèn · Dây xanh là màu minh họa, không phải trạng thái online.</text><text x="45" y="1112" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" fill="#526477" text-anchor="start">Vẽ lại để nhập/đối chiếu trong TIA V16; chưa Compile hoặc chạy trên CPU Siemens.</text><text x="1555" y="1112" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#526477" text-anchor="end">Trang 9</text></svg>